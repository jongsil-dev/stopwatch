<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<title>초시계</title>

<!-- iOS 웹앱(PWA) 메타 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="초시계">
<meta name="application-name" content="초시계">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<!-- 인라인 SVG 애플 터치 아이콘 / 파비콘 (외부 파일 없음) -->
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d10'/%3E%3Ccircle cx='90' cy='100' r='50' fill='none' stroke='%2334d399' stroke-width='10'/%3E%3Cpath d='M90 100V74' stroke='%2334d399' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M64 40h52' stroke='%2334d399' stroke-width='10' stroke-linecap='round'/%3E%3Crect x='84' y='26' width='12' height='18' rx='6' fill='%2334d399'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d10'/%3E%3Ccircle cx='90' cy='100' r='50' fill='none' stroke='%2334d399' stroke-width='10'/%3E%3Cpath d='M90 100V74' stroke='%2334d399' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M64 40h52' stroke='%2334d399' stroke-width='10' stroke-linecap='round'/%3E%3Crect x='84' y='26' width='12' height='18' rx='6' fill='%2334d399'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#0b0d10;
    --bg-glow:#12202a;
    --card:#14171c;
    --card-2:#191d24;
    --line:rgba(255,255,255,.08);
    --text:#f3f6f9;
    --muted:#8b94a3;
    --dim:#5c6573;
    --green:#34d399;
    --green-ink:#04120c;
    --amber:#fbbf24;
    --amber-ink:#1a1200;
    --red:#f87171;
    --shadow:0 18px 40px -18px rgba(0,0,0,.85);
    --accent-glow:rgba(52,211,153,.35);
  }
  html[data-theme="light"]{
    --bg:#eef1f5;
    --bg-glow:#dbe6f0;
    --card:#ffffff;
    --card-2:#f5f7fa;
    --line:rgba(16,20,24,.09);
    --text:#0d1116;
    --muted:#5f6b7a;
    --dim:#94a0ae;
    --green:#059669;
    --green-ink:#ffffff;
    --amber:#d97706;
    --amber-ink:#ffffff;
    --red:#dc2626;
    --shadow:0 18px 40px -22px rgba(16,24,40,.35);
    --accent-glow:rgba(5,150,105,.25);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-glow) 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic","Liberation Sans","Noto Sans","Noto Sans CJK KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    transition:background-color .28s ease,color .28s ease;
  }

  .app{
    min-height:100dvh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:
      calc(env(safe-area-inset-top) + 14px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 18px)
      calc(env(safe-area-inset-left) + 18px);
    max-width:560px;
    margin:0 auto;
  }

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .brand svg{width:16px;height:16px;display:block;flex:none}
  .tools{display:flex;gap:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    transition:transform .15s ease,color .2s ease,background .2s ease,border-color .2s ease;
  }
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:18px;height:18px;display:block}
  .icon-btn[aria-pressed="true"]{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
  .icon-btn .off-slash{display:none}
  .icon-btn[aria-pressed="false"] .off-slash{display:block}
  .icon-btn[aria-pressed="false"] .wave{opacity:.28}

  /* timer */
  .stage{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:6px 0 0;
    min-height:150px;
  }
  .status{
    display:flex;align-items:center;gap:7px;
    font-size:11.5px;letter-spacing:.18em;font-weight:700;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:10px;
    height:14px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 var(--accent-glow);
    opacity:0;
    transform:scale(.6);
    transition:opacity .2s ease,transform .2s ease;
  }
  body[data-state="running"] .dot{opacity:1;transform:scale(1);animation:pulse 1.6s ease-out infinite}
  body[data-state="running"] .status{color:var(--green)}
  body[data-state="paused"] .status{color:var(--amber)}
  body[data-state="paused"] .dot{opacity:1;transform:scale(1);background:var(--amber);animation:none;box-shadow:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 var(--accent-glow)}
    70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }

  .clock{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1,"ss01" 1;
    font-weight:250;
    font-size:clamp(58px,21.5vw,92px);
    line-height:.98;
    letter-spacing:-.03em;
    display:flex;
    align-items:baseline;
    justify-content:center;
    color:var(--text);
    transition:color .25s ease;
  }
  .clock .main{display:inline-block}
  .clock .cs{
    font-size:.42em;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0;
    margin-left:.06em;
    min-width:1.5ch;
    display:inline-block;
  }
  body[data-state="paused"] .clock{opacity:.78}

  .under{
    margin-top:12px;
    font-size:12px;
    color:var(--dim);
    height:16px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }

  /* controls */
  .controls{
    flex:none;
    display:flex;
    justify-content:center;
    gap:26px;
    padding:14px 0 18px;
  }
  .btn{
    -webkit-appearance:none;
    appearance:none;
    border:0;
    cursor:pointer;
    width:84px;height:84px;
    border-radius:50%;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    display:grid;place-items:center;
    position:relative;
    transition:transform .13s ease,filter .2s ease,opacity .2s ease,background .2s ease,color .2s ease,box-shadow .25s ease;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.94)}
  .btn.primary{background:var(--green);color:var(--green-ink);box-shadow:0 14px 30px -12px var(--accent-glow),var(--shadow)}
  .btn.primary.pause{background:var(--amber);color:var(--amber-ink);box-shadow:0 14px 30px -14px rgba(251,191,36,.35),var(--shadow)}
  .btn.secondary{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn:disabled{
    opacity:.34;
    cursor:default;
    box-shadow:none;
  }
  .btn:disabled:active{transform:none}

  /* laps */
  .laps{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    flex:0 1 auto;
    min-height:104px;
    max-height:44vh;
    transition:background .25s ease,border-color .25s ease;
  }
  .laps-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 10px;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .laps-title{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
  .laps-title b{color:var(--text);font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
  .copy{
    -webkit-appearance:none;appearance:none;
    border:1px solid var(--line);
    background:var(--card-2);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;font-weight:650;
    padding:6px 11px;border-radius:999px;
    cursor:pointer;
    transition:color .2s ease,border-color .2s ease,transform .13s ease;
    white-space:nowrap;
  }
  .copy:active{transform:scale(.95)}
  .copy.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
  .copy:disabled{opacity:.4}

  .rows{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; flex:1}
  .empty{
    padding:22px 16px 26px;
    text-align:center;
    color:var(--dim);
    font-size:12.5px;
    line-height:1.7;
  }
  .row{
    display:grid;
    grid-template-columns:44px 1fr 1fr;
    align-items:center;
    gap:6px;
    padding:10px 16px;
    font-variant-numeric:tabular-nums;
    font-size:14.5px;
    border-bottom:1px solid var(--line);
    animation:slide .22s ease both;
  }
  .row:last-child{border-bottom:0}
  @keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .row .n{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.04em}
  .row .seg{color:var(--text);font-weight:600}
  .row .tot{color:var(--muted);text-align:right;font-weight:500}
  .row.best .seg{color:var(--green)}
  .row.worst .seg{color:var(--red)}
  .row.best .n::after{content:"▲";font-size:8px;margin-left:4px;color:var(--green)}
  .row.worst .n::after{content:"▼";font-size:8px;margin-left:4px;color:var(--red)}

  /* button state visibility */
  .only-idle,.only-run,.only-pause{display:none}
  body[data-state="idle"] .only-idle{display:grid}
  body[data-state="running"] .only-run{display:grid}
  body[data-state="paused"] .only-pause{display:grid}
  .only-idle.tap,.only-run.tap,.only-pause.tap{display:none}
  body[data-state="idle"] .tap.only-idle{display:inline}
  body[data-state="running"] .tap.only-run{display:inline}
  body[data-state="paused"] .tap.only-pause{display:inline}

  .foot{
    flex:none;
    text-align:center;
    font-size:11px;
    color:var(--dim);
    padding:12px 6px 2px;
    line-height:1.6;
    letter-spacing:.01em;
  }
  .foot span{opacity:.85}

  @media (max-height:700px){
    .clock{font-size:clamp(52px,19vw,74px)}
    .btn{width:74px;height:74px;font-size:14px}
    .controls{gap:20px;padding:10px 0 14px}
    .stage{min-height:150px}
  }
</style>
</head>
<body data-state="idle">
<div class="app">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="8" y="2.5" width="8" height="4" rx="1.6"/>
        <circle cx="12" cy="14" r="7.5"/>
        <path d="M12 10.5V14l2.4 1.6"/>
      </svg>
      <span>초시계</span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="효과음 켜기/끄기" title="효과음">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3l4-3.2v11.4l-4-3.2H4z"/>
          <path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6"/>
          <path class="wave" d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/>
          <path class="off-slash" d="M15.5 9.6l5.2 4.8M20.7 9.6l-5.2 4.8"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-pressed="true" aria-label="라이트/다크 모드 전환" title="테마">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path id="themeIcon" d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.7 8.7 0 1 0 10.9 10.9z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="status">
      <span class="dot"></span>
      <span id="statusText">READY</span>
    </div>

    <div class="clock" id="clock" aria-live="off">
      <span class="main" id="mainTime">00:00</span><span class="cs" id="csTime">.00</span>
    </div>

    <div class="under" id="underText">시작을 누르면 0.01초 단위로 기록됩니다</div>
  </main>

  <div class="controls">
    <button class="btn secondary only-idle" id="resetBtn" type="button" disabled>초기화</button>
    <button class="btn secondary only-run" id="lapBtn" type="button">랩</button>
    <button class="btn secondary only-pause" id="resetBtn2" type="button">초기화</button>

    <button class="btn primary only-idle" id="startBtn" type="button">시작</button>
    <button class="btn primary pause only-run" id="pauseBtn" type="button">일시정지</button>
    <button class="btn primary only-pause" id="resumeBtn" type="button">계속</button>
  </div>

  <section class="laps" aria-label="구간 기록">
    <div class="laps-head">
      <div class="laps-title">구간 기록<b id="lapCount">0</b></div>
      <button class="copy" id="copyBtn" type="button" disabled>기록 복사</button>
    </div>
    <div class="rows" id="rows">
      <div class="empty" id="empty">랩을 누르면 구간 시간이<br>여기에 쌓입니다</div>
    </div>
  </section>

  <div class="foot"><span>오프라인에서도 동작 · 홈 화면에 추가하면 앱처럼 열립니다</span></div>
</div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var mainEl = $("mainTime"), csEl = $("csTime"), clockEl = $("clock");
  var statusText = $("statusText"), underText = $("underText");
  var rowsEl = $("rows"), emptyEl = $("empty"), lapCountEl = $("lapCount");
  var copyBtn = $("copyBtn");
  var themeBtn = $("themeBtn"), soundBtn = $("soundBtn");

  /* ---------- 저장값 ---------- */
  var store = {
    get: function(k, d){ try{ var v = localStorage.getItem("sw." + k); return v === null ? d : v; }catch(e){ return d; } },
    set: function(k, v){ try{ localStorage.setItem("sw." + k, v); }catch(e){} }
  };

  /* ---------- 테마 ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark";
    themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    document.getElementById("themeIcon").setAttribute("d", dark
      ? "M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.7 8.7 0 1 0 10.9 10.9z"
      : "M12 4.2v-1.7M12 21.5v-1.7M4.2 12H2.5M21.5 12h-1.7M6.5 6.5L5.3 5.3M18.7 18.7l-1.2-1.2M17.5 6.5l1.2-1.2M5.3 18.7l1.2-1.2");
    document.getElementById("themeIcon").setAttribute("fill", dark ? "none" : "none");
    if(!dark){
      // 해 아이콘: 원 추가를 위해 별도 처리
      ensureSun();
    } else {
      removeSun();
    }
  }
  var sunCircle = null;
  function ensureSun(){
    if(sunCircle) return;
    var svg = themeBtn.querySelector("svg");
    sunCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    sunCircle.setAttribute("cx","12"); sunCircle.setAttribute("cy","12"); sunCircle.setAttribute("r","4.2");
    svg.appendChild(sunCircle);
  }
  function removeSun(){
    if(!sunCircle) return;
    if(sunCircle.parentNode) sunCircle.parentNode.removeChild(sunCircle);
    sunCircle = null;
  }

  var theme = store.get("theme", "dark");
  if(theme !== "light" && theme !== "dark") theme = "dark";
  applyTheme(theme);

  themeBtn.addEventListener("click", function(){
    theme = (document.documentElement.getAttribute("data-theme") === "dark") ? "light" : "dark";
    applyTheme(theme);
    store.set("theme", theme);
    sfx("tick");
  });

  /* ---------- 효과음 (Web Audio, 외부 파일 없음) ---------- */
  var soundOn = store.get("sound", "1") !== "0";
  var actx = null;

  function setSoundUI(){
    soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  }
  setSoundUI();

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    setSoundUI();
    store.set("sound", soundOn ? "1" : "0");
    if(soundOn) sfx("start");
  });

  function ensureAudio(){
    if(!soundOn) return null;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!actx) actx = new AC();
      if(actx.state === "suspended") actx.resume();
      return actx;
    }catch(e){ return null; }
  }

  function blip(freq, dur, vol, type, delay){
    var c = ensureAudio();
    if(!c) return;
    try{
      var t0 = c.currentTime + (delay || 0);
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }catch(e){}
  }

  function sfx(kind){
    if(!soundOn) return;
    if(kind === "start"){ blip(784, 0.10, 0.10, "sine", 0); blip(1175, 0.12, 0.07, "sine", 0.05); }
    else if(kind === "pause"){ blip(520, 0.09, 0.09, "triangle", 0); blip(392, 0.10, 0.06, "triangle", 0.05); }
    else if(kind === "lap"){ blip(1046, 0.055, 0.075, "sine", 0); }
    else if(kind === "reset"){ blip(392, 0.08, 0.08, "triangle", 0); blip(262, 0.12, 0.06, "triangle", 0.06); }
    else if(kind === "tick"){ blip(880, 0.04, 0.05, "sine", 0); }
  }

  /* ---------- 타이머 상태 ---------- */
  var st = {
    running: false,
    acc: 0,          // 누적 (ms)
    startPerf: 0,    // performance.now() 기준 시작
    startWall: 0,    // Date.now() 기준 시작 (백그라운드 보정)
    laps: []         // {delta, total}
  };

  function nowPerf(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function elapsed(){
    if(st.running){
      var byPerf = nowPerf() - st.startPerf;
      var byWall = Date.now() - st.startWall;
      // 탭 전환/절전 시에도 큰 값(실제 흐른 시간)을 채택
      return st.acc + Math.max(byPerf, byWall);
    }
    return st.acc;
  }

  function fmt(ms){
    if(!isFinite(ms) || ms < 0) ms = 0;
    var totalCs = Math.floor(ms / 10);           // 0.01초 단위
    var cs = totalCs % 100;
    var totalSec = Math.floor(totalCs / 100);
    var s = totalSec % 60;
    var totalMin = Math.floor(totalSec / 60);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    var big;
    if(h > 0){
      big = h + ":" + pad(m, 2) + ":" + pad(s, 2);
    } else {
      big = pad(m, 2) + ":" + pad(s, 2);
    }
    return { big: big, cs: "." + pad(cs, 2), short: big + "." + pad(cs, 2) };
  }
  function pad(n, w){
    n = String(Math.floor(n));
    while(n.length < w) n = "0" + n;
    return n;
  }

  var lastBig = "", lastCs = "";
  function paint(){
    var t = fmt(elapsed());
    if(t.big !== lastBig){ mainEl.textContent = t.big; lastBig = t.big; }
    if(t.cs !== lastCs){ csEl.textContent = t.cs; lastCs = t.cs; }
  }

  /* ---------- 렌더 루프 ---------- */
  var rafId = 0;
  function loop(){
    paint();
    rafId = st.running ? requestAnimationFrame(loop) : 0;
  }
  function startLoop(){ if(!rafId) rafId = requestAnimationFrame(loop); }
  function stopLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = 0; } }

  /* ---------- 화면 상태 ---------- */
  function setState(s){
    document.body.setAttribute("data-state", s);
    if(s === "idle"){
      statusText.textContent = "READY";
      underText.textContent = "시작을 누르면 0.01초 단위로 기록됩니다";
    } else if(s === "running"){
      statusText.textContent = "RUNNING";
      underText.textContent = "랩을 누르면 구간이 따로 기록됩니다";
    } else if(s === "paused"){
      statusText.textContent = "PAUSED";
      underText.textContent = "계속을 누르면 이어서 기록합니다";
    }
  }

  /* ---------- 조작 ---------- */
  function beginRun(){
    st.startPerf = nowPerf();
    st.startWall = Date.now();
    st.running = true;
    setState("running");
    paint();
    startLoop();
    requestWakeLock();
  }

  function start(){
    st.acc = 0;
    st.laps = [];
    renderLaps();
    beginRun();
    sfx("start");
  }

  function pause(){
    if(!st.running) return;
    st.acc = elapsed();
    st.running = false;
    stopLoop();
    paint();
    setState("paused");
    sfx("pause");
    releaseWakeLock();
  }

  function resume(){
    if(st.running) return;
    beginRun();
    sfx("start");
  }

  function reset(){
    st.running = false;
    st.acc = 0;
    st.laps = [];
    stopLoop();
    paint();
    setState("idle");
    renderLaps();
    sfx("reset");
    releaseWakeLock();
  }

  function addLap(){
    if(!st.running) return;
    var total = elapsed();
    var prev = st.laps.length ? st.laps[st.laps.length - 1].total : 0;
    var delta = total - prev;
    if(delta < 1) delta = 0;
    st.laps.push({ delta: delta, total: total });
    renderLaps();
    sfx("lap");
  }

  /* ---------- 랩 렌더 ---------- */
  function renderLaps(){
    lapCountEl.textContent = String(st.laps.length);
    copyBtn.disabled = st.laps.length === 0;

    var n = st.laps.length;
    if(n === 0){
      rowsEl.innerHTML = '<div class="empty" id="empty">랩을 누르면 구간 시간이<br>여기에 쌓입니다</div>';
      return;
    }

    var best = -1, worst = -1;
    if(n >= 2){
      var bv = Infinity, wv = -Infinity;
      for(var i = 0; i < n; i++){
        if(st.laps[i].delta < bv){ bv = st.laps[i].delta; best = i; }
        if(st.laps[i].delta > wv){ wv = st.laps[i].delta; worst = i; }
      }
    }

    var html = "";
    for(var j = n - 1; j >= 0; j--){
      var L = st.laps[j];
      var cls = "row";
      if(j === best) cls += " best";
      if(j === worst) cls += " worst";
      html += '<div class="' + cls + '">'
            + '<div class="n">' + pad(j + 1, 2) + '</div>'
            + '<div class="seg">' + fmt(L.delta).short + '</div>'
            + '<div class="tot">' + fmt(L.total).short + '</div>'
            + '</div>';
    }
    rowsEl.innerHTML = html;
  }

  /* ---------- 복사 ---------- */
  function copyLaps(){
    if(!st.laps.length) return;
    var lines = ["초시계 기록", ""];
    for(var i = 0; i < st.laps.length; i++){
      var L = st.laps[i];
      lines.push(pad(i + 1, 2) + "  구간 " + fmt(L.delta).short + "   누적 " + fmt(L.total).short);
    }
    if(st.laps.length){
      lines.push("");
      lines.push("총 " + fmt(elapsed()).short);
    }
    var text = lines.join("\n");

    function ok(){
      copyBtn.textContent = "복사됨";
      copyBtn.classList.add("ok");
      sfx("lap");
      setTimeout(function(){ copyBtn.textContent = "기록 복사"; copyBtn.classList.remove("ok"); }, 1500);
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(function(){ fallback(text, ok); });
    } else {
      fallback(text, ok);
    }
  }
  function fallback(text, cb){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var done = document.execCommand("copy");
      document.body.removeChild(ta);
      if(done) cb();
    }catch(e){}
  }

  /* ---------- 화면 꺼짐 방지 ---------- */
  var wakeLock = null;
  function requestWakeLock(){
    try{
      if(navigator.wakeLock && navigator.wakeLock.request){
        navigator.wakeLock.request("screen").then(function(w){ wakeLock = w; w.addEventListener("release", function(){ wakeLock = null; }); }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock && wakeLock.release){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }

  /* ---------- 버튼 ---------- */
  $("startBtn").addEventListener("click", start);
  $("pauseBtn").addEventListener("click", pause);
  $("resumeBtn").addEventListener("click", resume);
  $("resetBtn").addEventListener("click", reset);
  $("resetBtn2").addEventListener("click", reset);
  $("lapBtn").addEventListener("click", addLap);
  copyBtn.addEventListener("click", copyLaps);

  /* ---------- 키보드 ---------- */
  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if(k === " " || k === "Spacebar"){
      e.preventDefault();
      if(st.running) pause(); else if(st.acc > 0) resume(); else start();
    } else if(k === "l" || k === "L"){
      e.preventDefault(); addLap();
    } else if(k === "r" || k === "R"){
      e.preventDefault(); reset();
    }
  });

  /* ---------- 백그라운드/화면 복귀 보정 ---------- */
  function sync(){
    if(st.running){ paint(); startLoop(); }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      sync();
      if(st.running) requestWakeLock();
    } else {
      releaseWakeLock();
    }
  });
  window.addEventListener("pageshow", sync);
  window.addEventListener("focus", sync);
  window.addEventListener("orientationchange", function(){ setTimeout(sync, 120); });

  /* ---------- 초기화 ---------- */
  setState("idle");
  paint();
  renderLaps();
})();
</script>
</body>
</html>
