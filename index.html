<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<title>티켓팅 시계 · 실시간 시계 &amp; 초시계</title>

<!-- iOS 웹앱(PWA) 메타 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="티켓팅 시계">
<meta name="application-name" content="티켓팅 시계">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<!-- 인라인 SVG 애플 터치 아이콘 / 파비콘 (외부 파일 없음) -->
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d10'/%3E%3Ccircle cx='90' cy='90' r='54' fill='none' stroke='%2334d399' stroke-width='10'/%3E%3Cpath d='M90 56v36l22 14' fill='none' stroke='%2334d399' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d10'/%3E%3Ccircle cx='90' cy='90' r='54' fill='none' stroke='%2334d399' stroke-width='10'/%3E%3Cpath d='M90 56v36l22 14' fill='none' stroke='%2334d399' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#0b0d10;
    --bg-glow:#12202a;
    --card:#14171c;
    --card-2:#191d24;
    --line:rgba(255,255,255,.08);
    --text:#f3f6f9;
    --muted:#8b94a3;
    --dim:#5c6573;
    --green:#34d399;
    --green-ink:#04120c;
    --amber:#fbbf24;
    --amber-ink:#1a1200;
    --red:#f87171;
    --shadow:0 18px 40px -18px rgba(0,0,0,.85);
    --accent-glow:rgba(52,211,153,.35);
    --red-glow:rgba(248,113,113,.40);
  }
  html[data-theme="light"]{
    --bg:#eef1f5;
    --bg-glow:#dbe6f0;
    --card:#ffffff;
    --card-2:#f5f7fa;
    --line:rgba(16,20,24,.09);
    --text:#0d1116;
    --muted:#5f6b7a;
    --dim:#94a0ae;
    --green:#059669;
    --green-ink:#ffffff;
    --amber:#d97706;
    --amber-ink:#ffffff;
    --red:#dc2626;
    --shadow:0 18px 40px -22px rgba(16,24,40,.35);
    --accent-glow:rgba(5,150,105,.25);
    --red-glow:rgba(220,38,38,.28);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-glow) 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic","Liberation Sans","Noto Sans","Noto Sans CJK KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    transition:background-color .28s ease,color .28s ease;
  }

  .app{
    min-height:100dvh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 14px)
      calc(env(safe-area-inset-left) + 18px);
    max-width:560px;
    margin:0 auto;
  }

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
  .brand{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .brand svg{width:17px;height:17px;display:block;flex:none;color:var(--green)}
  .tools{display:flex;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    transition:transform .15s ease,color .2s ease,background .2s ease,border-color .2s ease;
  }
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:17px;height:17px;display:block}
  .icon-btn[aria-pressed="true"]{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
  .icon-btn .off-slash{display:none}
  .icon-btn[aria-pressed="false"] .off-slash{display:block}
  .icon-btn[aria-pressed="false"] .wave{opacity:.28}

  /* tabs */
  .tabs{
    flex:none;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    margin-top:12px;
    padding:4px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    transition:background .25s ease,border-color .25s ease;
  }
  .tab{
    -webkit-appearance:none;appearance:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.01em;
    padding:10px 6px;
    border-radius:12px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .2s ease,color .2s ease,box-shadow .2s ease,transform .12s ease;
  }
  .tab svg{width:15px;height:15px;display:block;flex:none}
  .tab:active{transform:scale(.985)}
  .tab[aria-selected="true"]{
    background:var(--card-2);
    color:var(--text);
    box-shadow:0 6px 18px -12px rgba(0,0,0,.7), inset 0 0 0 1px var(--line);
  }
  .tab[aria-selected="true"] svg{color:var(--green)}

  /* views */
  .view{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  .view[hidden]{display:none!important}

  /* ---------- 실시간 시계 ---------- */
  .view-clock{justify-content:center;padding:10px 0 2px;gap:0}
  .live-row{
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:10.5px;letter-spacing:.2em;font-weight:800;color:var(--dim);
    text-transform:uppercase;height:14px;
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 var(--accent-glow);
    animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 var(--accent-glow)}
    70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }

  .clock{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1,"ss01" 1;
    font-weight:300;
    line-height:.98;
    letter-spacing:-.028em;
    display:flex;
    align-items:baseline;
    justify-content:center;
    color:var(--text);
    transition:color .25s ease,opacity .25s ease;
  }
  .clock .main{display:inline-block}
  .clock .cs{
    font-size:.40em;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0;
    margin-left:.05em;
    min-width:1.45ch;
    display:inline-block;
  }
  .clock.big{
    font-size:clamp(46px,16.4vw,70px);
    margin-top:6px;
  }
  .date{
    margin-top:9px;
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.01em;
    text-align:center;
    font-variant-numeric:tabular-nums;
    height:17px;
  }

  /* PiP button */
  .pip-btn{
    -webkit-appearance:none;appearance:none;
    flex:none;
    margin-top:16px;
    width:100%;
    min-height:48px;
    border-radius:15px;
    border:1px solid color-mix(in srgb,var(--green) 38%,transparent);
    background:color-mix(in srgb,var(--green) 10%,var(--card));
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:750;
    letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;
    transition:transform .13s ease,background .2s ease,border-color .2s ease,color .2s ease;
  }
  .pip-btn:active{transform:scale(.985)}
  .pip-btn svg{width:18px;height:18px;display:block;flex:none;color:var(--green)}
  .pip-btn.on{
    background:color-mix(in srgb,var(--green) 20%,var(--card));
    border-color:var(--green);
  }
  .pip-note{
    flex:none;
    margin-top:8px;
    font-size:11.5px;
    line-height:1.55;
    color:var(--muted);
    text-align:center;
    letter-spacing:.01em;
  }
  .pip-note.ok{color:var(--green);font-weight:650}
  .pip-note.warn{color:var(--amber)}
  .pip-note:empty{display:none}

  /* target card */
  .target-card{
    flex:none;
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:13px 15px 14px;
    transition:background .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .target-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
  .target-title{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted)}
  .link-btn{
    -webkit-appearance:none;appearance:none;border:0;background:transparent;
    color:var(--dim);font-family:inherit;font-size:11.5px;font-weight:700;
    padding:2px 4px;border-radius:8px;cursor:pointer;text-decoration:underline;
    text-underline-offset:2px;
  }
  .link-btn:active{color:var(--text)}

  .countdown{
    display:flex;align-items:baseline;justify-content:center;
    margin-top:4px;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    font-weight:300;
    font-size:clamp(30px,9.6vw,42px);
    letter-spacing:-.02em;
    line-height:1.12;
    color:var(--text);
    transition:color .2s ease,transform .2s ease;
  }
  .countdown.idle{color:var(--dim)}
  .countdown .tenth{font-size:.5em;font-weight:600;color:var(--muted);margin-left:.06em;min-width:1.7ch;display:inline-block}
  .countdown.warn{color:var(--red)}
  .countdown.warn .tenth{color:var(--red)}
  .countdown.hit{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
  .cd-sub{
    margin-top:3px;
    text-align:center;
    font-size:11.5px;
    color:var(--dim);
    line-height:1.5;
    min-height:17px;
  }
  .target-card.warn{
    border-color:color-mix(in srgb,var(--red) 55%,transparent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 25%,transparent), 0 12px 34px -18px var(--red-glow);
  }
  .target-card.hit{
    border-color:var(--red);
    animation:hitflash .9s ease-out 2;
  }
  @keyframes hitflash{
    0%{box-shadow:0 0 0 0 var(--red-glow), 0 12px 34px -18px var(--red-glow)}
    100%{box-shadow:0 0 0 16px rgba(248,113,113,0), 0 12px 34px -18px var(--red-glow)}
  }

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{
    -webkit-appearance:none;appearance:none;
    border:1px solid var(--line);
    background:var(--card-2);
    color:var(--text);
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    border-radius:999px;
    cursor:pointer;
    display:flex;align-items:center;gap:5px;
    font-variant-numeric:tabular-nums;
    transition:background .18s ease,border-color .18s ease,color .18s ease,transform .12s ease;
  }
  .chip:active{transform:scale(.96)}
  .chip b{font-weight:800;color:var(--muted);font-size:11.5px}
  .chip.on{
    background:color-mix(in srgb,var(--green) 16%,transparent);
    border-color:color-mix(in srgb,var(--green) 55%,transparent);
    color:var(--green);
  }
  .chip.on b{color:var(--green)}

  .custom-row{display:flex;gap:8px;margin-top:8px}
  .time-input{
    -webkit-appearance:none;appearance:none;
    flex:1 1 auto;min-width:0;
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:650;
    font-variant-numeric:tabular-nums;
    padding:10px 12px;
    min-height:42px;
  }
  .time-input::-webkit-date-and-time-value{text-align:left}
  .time-input:focus{outline:none;border-color:color-mix(in srgb,var(--green) 55%,transparent)}
  .set-btn{
    -webkit-appearance:none;appearance:none;
    flex:none;
    background:var(--green);
    color:var(--green-ink);
    border:0;
    border-radius:12px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:800;
    padding:0 16px;
    min-height:42px;
    cursor:pointer;
    transition:transform .12s ease,filter .2s ease;
  }
  .set-btn:active{transform:scale(.97)}

  /* ---------- 초시계 ---------- */
  .view-stop{padding-top:2px;justify-content:center}
  .stage{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:4px 0 0;
    min-height:130px;
  }
  .status{
    display:flex;align-items:center;gap:7px;
    font-size:11.5px;letter-spacing:.18em;font-weight:700;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:8px;
    height:14px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 var(--accent-glow);
    opacity:0;
    transform:scale(.6);
    transition:opacity .2s ease,transform .2s ease;
  }
  body[data-state="running"] .dot{opacity:1;transform:scale(1);animation:pulse 1.6s ease-out infinite}
  body[data-state="running"] .status{color:var(--green)}
  body[data-state="paused"] .status{color:var(--amber)}
  body[data-state="paused"] .dot{opacity:1;transform:scale(1);background:var(--amber);animation:none;box-shadow:none}

  .clock.stop{font-size:clamp(46px,15.5vw,64px)}
  body[data-state="paused"] .clock.stop{opacity:.78}

  .under{
    margin-top:10px;
    font-size:12px;
    color:var(--dim);
    height:16px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }

  .controls{
    flex:none;
    display:flex;
    justify-content:center;
    gap:26px;
    padding:12px 0 14px;
  }
  .btn{
    -webkit-appearance:none;
    appearance:none;
    border:0;
    cursor:pointer;
    width:80px;height:80px;
    border-radius:50%;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    display:grid;place-items:center;
    position:relative;
    transition:transform .13s ease,filter .2s ease,opacity .2s ease,background .2s ease,color .2s ease,box-shadow .25s ease;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.94)}
  .btn.primary{background:var(--green);color:var(--green-ink);box-shadow:0 14px 30px -12px var(--accent-glow),var(--shadow)}
  .btn.primary.pause{background:var(--amber);color:var(--amber-ink);box-shadow:0 14px 30px -14px rgba(251,191,36,.35),var(--shadow)}
  .btn.secondary{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn:disabled{opacity:.34;cursor:default;box-shadow:none}
  .btn:disabled:active{transform:none}

  .laps{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    flex:0 1 auto;
    min-height:96px;
    max-height:38vh;
    transition:background .25s ease,border-color .25s ease;
  }
  .laps-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 15px 9px;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .laps-title{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
  .laps-title b{color:var(--text);font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
  .copy{
    -webkit-appearance:none;appearance:none;
    border:1px solid var(--line);
    background:var(--card-2);
    color:var(--muted);
    font-family:inherit;
    font-size:11.5px;font-weight:650;
    padding:6px 11px;border-radius:999px;
    cursor:pointer;
    transition:color .2s ease,border-color .2s ease,transform .13s ease;
    white-space:nowrap;
  }
  .copy:active{transform:scale(.95)}
  .copy.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
  .copy:disabled{opacity:.4}

  .rows{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
  .empty{
    padding:20px 16px 24px;
    text-align:center;
    color:var(--dim);
    font-size:12.5px;
    line-height:1.7;
  }
  .row{
    display:grid;
    grid-template-columns:44px 1fr 1fr;
    align-items:center;
    gap:6px;
    padding:9px 15px;
    font-variant-numeric:tabular-nums;
    font-size:14px;
    border-bottom:1px solid var(--line);
    animation:slide .22s ease both;
  }
  .row:last-child{border-bottom:0}
  @keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .row .n{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.04em}
  .row .seg{color:var(--text);font-weight:600}
  .row .tot{color:var(--muted);text-align:right;font-weight:500}
  .row.best .seg{color:var(--green)}
  .row.worst .seg{color:var(--red)}
  .row.best .n::after{content:"▲";font-size:8px;margin-left:4px;color:var(--green)}
  .row.worst .n::after{content:"▼";font-size:8px;margin-left:4px;color:var(--red)}

  /* button state visibility */
  .only-idle,.only-run,.only-pause{display:none}
  body[data-state="idle"] .only-idle{display:grid}
  body[data-state="running"] .only-run{display:grid}
  body[data-state="paused"] .only-pause{display:grid}
  .only-idle.tap,.only-run.tap,.only-pause.tap{display:none}
  body[data-state="idle"] .tap.only-idle{display:inline}
  body[data-state="running"] .tap.only-run{display:inline}
  body[data-state="paused"] .tap.only-pause{display:inline}

  .foot{
    flex:none;
    text-align:center;
    font-size:11px;
    color:var(--dim);
    padding:10px 6px 0;
    line-height:1.6;
    letter-spacing:.01em;
  }
  .foot span{opacity:.9}
  .foot .f-clock{display:block}
  .foot .f-stop{display:none}
  body[data-view="stop"] .foot .f-clock{display:none}
  body[data-view="stop"] .foot .f-stop{display:block}

  /* 숨은 PiP 소스 (화면에는 안 보이지만 렌더는 되어야 함) */
  #pipCanvas{
    position:fixed;left:-10000px;top:0;
    width:640px;height:360px;
    pointer-events:none;
    opacity:0;
  }
  #pipVideo{
    position:fixed;left:0;bottom:0;
    width:1px;height:1px;
    opacity:.01;
    pointer-events:none;
    z-index:-1;
  }

  @media (max-height:720px){
    .clock.big{font-size:clamp(42px,14.5vw,60px)}
    .clock.stop{font-size:clamp(42px,14vw,58px)}
    .btn{width:72px;height:72px;font-size:14px}
    .controls{gap:20px;padding:8px 0 10px}
    .stage{min-height:110px}
    .pip-btn{margin-top:12px;min-height:44px}
    .target-card{margin-top:10px;padding:11px 13px 12px}
    .countdown{font-size:clamp(27px,8.6vw,36px)}
  }
</style>
</head>
<body data-state="idle" data-view="clock">
<div class="app">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.6"/>
        <path d="M12 7.4V12l3.4 2.2"/>
      </svg>
      <span>티켓팅 시계</span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="효과음 켜기/끄기" title="효과음">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path id="themeIcon" d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.7 8.7 0 1 0 10.9 10.9z"/>

  <nav class="tabs" role="tablist" aria-label="모드 선택">
    <button class="tab" id="tabClock" type="button" role="tab" aria-selected="true" aria-controls="viewClock" data-tab="clock">

    </button>
    <button class="tab" id="tabStop" type="button" role="tab" aria-selected="false" aria-controls="viewStop" data-tab="stop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <rect x="8" y="2.5" width="8" height="4" rx="1.6"/><circle cx="12" cy="14" r="7.5"/><path d="M12 10.5V14l2.4 1.6"/>
      </svg>
      <span>초시계</span>
    </button>
  </nav>

  <!-- ===== 실시간 시계 (티켓팅 모드) ===== -->
  <section class="view view-clock" id="viewClock" role="tabpanel" aria-labelledby="tabClock">
    <div class="live-row"><span class="live-dot"></span><span>LIVE · 한국 표준시</span></div>

    <div class="clock big" id="wallClock" aria-live="off">
      <span class="main" id="wallMain">--:--:--</span><span class="cs" id="wallCs">.00</span>
    </div>
    <div class="date" id="wallDate">&nbsp;</div>

    <button class="pip-btn" id="pipBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.8" y="4.6" width="18.4" height="14.8" rx="3"/>
        <rect x="12.2" y="11.6" width="7.4" height="6" rx="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <span id="pipBtnText">작은 창으로 띄우기 (PiP)</span>
    </button>
    <div class="pip-note" id="pipNote" role="status"></div>

    <div class="target-card" id="targetCard">
      <div class="target-head">
        <div class="target-title">목표 시각까지</div>
        <button class="link-btn" id="clearTarget" type="button" hidden>해제</button>
      </div>

      <div class="countdown idle" id="countdown" aria-live="off">
        <span class="val" id="cdVal">--:--:--</span><span class="tenth" id="cdTenth">.0</span>

      <div class="chips" id="chips">
        <button class="chip" type="button" data-preset="next">다음 정각 <b id="nextHourLabel">--:00</b></button>
        <button class="chip" type="button" data-preset="10:00">10:00</button>

  <!-- ===== 초시계 ===== -->
  <section class="view view-stop" id="viewStop" role="tabpanel" aria-labelledby="tabStop" hidden>
    <main class="stage">
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">READY</span>
      </div>

      <div class="clock stop" id="clock" aria-live="off">
        <span class="main" id="mainTime">00:00</span><span class="cs" id="csTime">.00</span>
      </div>

      <div class="under" id="underText">시작을 누르면 0.01초 단위로 기록됩니다</div>
    </main>

    <div class="controls">
      <button class="btn secondary only-idle" id="resetBtn" type="button" disabled>초기화</button>
      <button class="btn secondary only-run" id="lapBtn" type="button">랩</button>
      <button class="btn secondary only-pause" id="resetBtn2" type="button">초기화</button>

      <button class="btn primary only-idle" id="startBtn" type="button">시작</button>
      <button class="btn primary pause only-run" id="pauseBtn" type="button">일시정지</button>
      <button class="btn primary only-pause" id="resumeBtn" type="button">계속</button>
    </div>

    <section class="laps" aria-label="구간 기록">

        <div class="laps-title">구간 기록<b id="lapCount">0</b></div>
        <button class="copy" id="copyBtn" type="button" disabled>기록 복사</button>
      </div>

        <div class="empty" id="empty">랩을 누르면 구간 시간이<br>여기에 쌓입니다</div>
      </div>
    </section>
  </section>

  <div class="foot">
    <span class="f-clock">오프라인 동작 · 작은 창(PiP)은 다른 앱을 켜도 위에 떠 있습니다</span>
    <span class="f-stop">오프라인에서도 동작 · 홈 화면에 추가하면 앱처럼 열립니다</span>
  </div>

  <canvas id="pipCanvas" width="640" height="360" aria-hidden="true"></canvas>
  <video id="pipVideo" muted playsinline autoplay aria-hidden="true"></video>
</div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 저장값 ---------- */
  var store = {
    get: function(k, d){ try{ var v = localStorage.getItem("sw." + k); return v === null ? d : v; }catch(e){ return d; } },
    set: function(k, v){ try{ localStorage.setItem("sw." + k, v); }catch(e){} },
    del: function(k){ try{ localStorage.removeItem("sw." + k); }catch(e){} }
  };

  function pad(n, w){
    n = String(Math.floor(n));
    while(n.length < w) n = "0" + n;
    return n;
  }

  /* ---------- 테마 ---------- */
  var themeBtn = $("themeBtn"), soundBtn = $("soundBtn");

  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark";
    themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    var icon = $("themeIcon");
    icon.setAttribute("d", dark
      ? "M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.7 8.7 0 1 0 10.9 10.9z"
      : "M12 4.2v-1.7M12 21.5v-1.7M4.2 12H2.5M21.5 12h-1.7M6.5 6.5L5.3 5.3M18.7 18.7l-1.2-1.2M17.5 6.5l1.2-1.2M5.3 18.7l1.2-1.2");
    if(dark){ removeSun(); } else { ensureSun(); }
    pipColors = readColors();
    lastDrawMs = 0;
  }
  var sunCircle = null;
  function ensureSun(){
    if(sunCircle) return;
    var svg = themeBtn.querySelector("svg");
    sunCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    sunCircle.setAttribute("cx","12"); sunCircle.setAttribute("cy","12"); sunCircle.setAttribute("r","4.2");
    svg.appendChild(sunCircle);
  }
  function removeSun(){
    if(!sunCircle) return;
    if(sunCircle.parentNode) sunCircle.parentNode.removeChild(sunCircle);
    sunCircle = null;
  }

  var theme = store.get("theme", "dark");
  if(theme !== "light" && theme !== "dark") theme = "dark";
  applyTheme(theme);

  themeBtn.addEventListener("click", function(){
    theme = (document.documentElement.getAttribute("data-theme") === "dark") ? "light" : "dark";
    applyTheme(theme);
    store.set("theme", theme);
    sfx("tick");
  });

  /* ---------- 효과음 (Web Audio, 외부 파일 없음) ---------- */
  var soundOn = store.get("sound", "1") !== "0";
  var actx = null;

  function setSoundUI(){ soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false"); }
  setSoundUI();

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    setSoundUI();
    store.set("sound", soundOn ? "1" : "0");
    if(soundOn) sfx("start");
  });

  function ensureAudio(){
    if(!soundOn) return null;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!actx) actx = new AC();
      if(actx.state === "suspended") actx.resume();
      return actx;
    }catch(e){ return null; }
  }

  function blip(freq, dur, vol, type, delay){
    var c = ensureAudio();
    if(!c) return;
    try{
      var t0 = c.currentTime + (delay || 0);
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }catch(e){}
  }

  function sfx(kind){
    if(!soundOn) return;
    if(kind === "start"){ blip(784, 0.10, 0.10, "sine", 0); blip(1175, 0.12, 0.07, "sine", 0.05); }
    else if(kind === "pause"){ blip(520, 0.09, 0.09, "triangle", 0); blip(392, 0.10, 0.06, "triangle", 0.05); }
    else if(kind === "lap"){ blip(1046, 0.055, 0.075, "sine", 0); }
    else if(kind === "reset"){ blip(392, 0.08, 0.08, "triangle", 0); blip(262, 0.12, 0.06, "triangle", 0.06); }
    else if(kind === "tick"){ blip(880, 0.04, 0.05, "sine", 0); }
    else if(kind === "warn"){ blip(1320, 0.055, 0.09, "square", 0); }
    else if(kind === "go"){ blip(880, 0.12, 0.10, "sine", 0); blip(1108, 0.12, 0.10, "sine", 0.13); blip(1480, 0.22, 0.10, "sine", 0.26); }
  }

  /* =========================================================
     탭 전환
     ========================================================= */
  var view = "clock";
  var tabClock = $("tabClock"), tabStop = $("tabStop");
  var viewClock = $("viewClock"), viewStop = $("viewStop");

  function setView(v){
    view = (v === "stop") ? "stop" : "clock";
    document.body.setAttribute("data-view", view);
    var isClock = view === "clock";
    tabClock.setAttribute("aria-selected", isClock ? "true" : "false");
    tabStop.setAttribute("aria-selected", isClock ? "false" : "true");
    viewClock.hidden = !isClock;
    viewStop.hidden = isClock;
    store.set("view", view);
    if(isClock){
      paintClock(Date.now());
      paintCountdown(Date.now());
      requestWakeLock();
    } else {
      releaseWakeLock();
      if(st.running) requestWakeLock();
    }
    lastDrawMs = 0;
  }

  tabClock.addEventListener("click", function(){ setView("clock"); sfx("tick"); });
  tabStop.addEventListener("click", function(){ setView("stop"); sfx("tick"); });

  document.querySelector(".tabs").addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault();
      setView(view === "clock" ? "stop" : "clock");
      (view === "clock" ? tabClock : tabStop).focus();
    }
  });

  /* =========================================================
     실시간 시계
     ========================================================= */
  var wallMain = $("wallMain"), wallCs = $("wallCs"), wallDate = $("wallDate");
  var WEEK = ["일","월","화","수","목","금","토"];

  var lastWallMain = "", lastWallCs = "", lastDateStr = "";

  function dateLabel(d){
    return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + WEEK[d.getDay()] + "요일";
  }

  function paintClock(ms){
    var d = new Date(ms);
    var main = pad(d.getHours(),2) + ":" + pad(d.getMinutes(),2) + ":" + pad(d.getSeconds(),2);
    var cs = "." + pad(Math.floor(d.getMilliseconds() / 10), 2);
    if(main !== lastWallMain){ wallMain.textContent = main; lastWallMain = main; }
    if(cs !== lastWallCs){ wallCs.textContent = cs; lastWallCs = cs; }
    var ds = dateLabel(d);
    if(ds !== lastDateStr){ wallDate.textContent = ds; lastDateStr = ds; }
  }

  /* =========================================================
     목표 시각 카운트다운
     ========================================================= */
  var targetCard = $("targetCard"), countdownEl = $("countdown");
  var cdVal = $("cdVal"), cdTenth = $("cdTenth"), cdSub = $("cdSub");
  var clearTargetBtn = $("clearTarget"), chipsEl = $("chips");
  var timeInput = $("timeInput"), nextHourLabel = $("nextHourLabel");

  var target = null;   // { ms, hhmm, span, setAt }
  var lastCdVal = "", lastCdTenth = "", lastCdState = "", lastCdSub = "";
  var lastWarnSec = null, doneFired = false;

  function minutesText(n){
    if(n < 60) return n + "분";
    var h = Math.floor(n / 60), m = n % 60;
    return m ? (h + "시간 " + m + "분") : (h + "시간");
  }

  function dayWord(targetMs, nowMs){
    var a = new Date(nowMs), b = new Date(targetMs);
    var da = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
    var db = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
    var diff = Math.round((db - da) / 86400000);
    if(diff === 0) return "오늘";
    if(diff === 1) return "내일";
    return (b.getMonth() + 1) + "월 " + b.getDate() + "일";
  }

  function fmtCd(ms){
    var t = Math.max(0, Math.floor(ms / 100));   // 0.1초 단위
    var tenth = t % 10;
    var totalSec = Math.floor(t / 10);
    var s = totalSec % 60;
    var totalMin = Math.floor(totalSec / 60);
    var m = totalMin % 60;
    var h = Math.floor(totalMin / 60);
    return { big: pad(h,2) + ":" + pad(m,2) + ":" + pad(s,2), tenth: "." + tenth };
  }

  function setTargetMs(ms, hhmm, silent){
    var now = Date.now();
    if(!isFinite(ms)) return;
    target = {
      ms: ms,
      hhmm: hhmm,
      setAt: now,
      span: Math.max(1000, ms - now)
    };
    doneFired = false;
    lastWarnSec = null;
    pipColors = readColors();
    lastDrawMs = 0;
    clearTargetBtn.hidden = false;
    markChips(hhmm);
    paintCountdown(now, true);
    store.set("target", JSON.stringify({ ms: ms, hhmm: hhmm }));
    if(!silent) sfx("start");
  }

  function setTargetHHMM(hhmm, fromPreset){
    if(!/^\d{2}:\d{2}$/.test(hhmm)) return false;
    var now = Date.now();
    var d = new Date(now);
    var h = parseInt(hhmm.slice(0,2), 10), m = parseInt(hhmm.slice(3,5), 10);
    d.setHours(h, m, 0, 0);
    // 이미 0.8초 이상 지난 시각이면 '다음 번' 그 시각으로
    if(d.getTime() <= now + 800) d.setDate(d.getDate() + 1);
    setTargetMs(d.getTime(), hhmm, false);
    if(fromPreset) timeInput.value = hhmm;
    return true;
  }

  function setNextHour(){
    var now = Date.now();
    var d = new Date(now);
    d.setMinutes(0, 0, 0);
    d.setHours(d.getHours() + 1);
    setTargetMs(d.getTime(), pad(d.getHours(),2) + ":00", false);
    timeInput.value = pad(d.getHours(),2) + ":00";
  }

  function clearTarget(silent){
    target = null;
    doneFired = false;
    lastWarnSec = null;
    clearTargetBtn.hidden = true;
    markChips(null);
    targetCard.classList.remove("warn", "hit");
    countdownEl.classList.remove("warn", "hit");
    countdownEl.classList.add("idle");
    cdVal.textContent = "--:--:--";
    cdTenth.textContent = "";
    cdSub.textContent = "목표 시각을 고르면 남은 시간이 표시됩니다";
    lastCdVal = ""; lastCdTenth = ""; lastCdState = ""; lastCdSub = "";
    store.del("target");
    lastDrawMs = 0;
    if(!silent) sfx("reset");
  }

  function markChips(hhmm){
    var chips = chipsEl.querySelectorAll(".chip");
    for(var i = 0; i < chips.length; i++){
      var p = chips[i].getAttribute("data-preset");
      var on = false;
      if(hhmm){
        if(p === "next") on = false;   // '다음 정각'은 정각 여부로 판단하지 않음
        else on = (p === hhmm);
      }
      chips[i].classList.toggle("on", on);
      chips[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  function paintCountdown(now, force){
    if(!target){
      if(lastCdState !== "idle"){
        countdownEl.classList.remove("warn", "hit");
        countdownEl.classList.add("idle");
        targetCard.classList.remove("warn", "hit");
        lastCdState = "idle";
      }
      return;
    }
    var rem = target.ms - now;
    if(rem < 0) rem = 0;
    var f = fmtCd(rem);
    if(f.big !== lastCdVal){ cdVal.textContent = f.big; lastCdVal = f.big; }
    if(f.tenth !== lastCdTenth){ cdTenth.textContent = f.tenth; lastCdTenth = f.tenth; }

    var state;
    if(rem <= 0) state = "done";
    else if(rem <= 10000) state = "warn";
    else state = "run";

    if(state !== lastCdState || force){
      countdownEl.classList.remove("idle");
      countdownEl.classList.toggle("warn", state === "warn" || state === "done");
      targetCard.classList.toggle("warn", state === "warn" || state === "done");
      lastCdState = state;
      if(state === "warn" || state === "done") lastDrawMs = 0;
    }

    /* 마지막 10초: 초가 바뀔 때마다 짧은 신호음 */
    if(state === "warn"){
      var secLeft = Math.ceil(rem / 1000);
      if(secLeft !== lastWarnSec){
        lastWarnSec = secLeft;
        sfx("warn");
        lastDrawMs = 0;
      }
    }

    /* 0초 도달 */
    if(state === "done" && !doneFired){
      doneFired = true;
      cdSub.textContent = target.hhmm + " 도착! 지금이 시작 시각입니다";
      lastCdSub = cdSub.textContent;
      countdownEl.classList.add("hit");
      targetCard.classList.add("hit");
      setTimeout(function(){
        countdownEl.classList.remove("hit");
        targetCard.classList.remove("hit");
      }, 2600);
      sfx("go");
      lastDrawMs = 0;
    }

    if(state !== "done"){
      var sub = target.hhmm + "까지 · " + dayWord(target.ms, now);
      if(rem > 3600000){
        sub += " · " + minutesText(Math.round(rem / 60000));
      }
      if(sub !== lastCdSub){ cdSub.textContent = sub; lastCdSub = sub; }
    }
  }

  chipsEl.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".chip") : null;
    if(!btn) return;
    var p = btn.getAttribute("data-preset");
    if(p === "next") setNextHour();
    else setTargetHHMM(p, true);
    var chips = chipsEl.querySelectorAll(".chip");
    for(var i = 0; i < chips.length; i++){
      chips[i].classList.toggle("on", chips[i] === btn);
      chips[i].setAttribute("aria-pressed", chips[i] === btn ? "true" : "false");
    }
  });

  $("setTarget").addEventListener("click", function(){
    var v = timeInput.value;
    if(!v){ cdSub.textContent = "먼저 목표 시각을 선택해 주세요"; return; }
    setTargetHHMM(v, false);
  });

  timeInput.addEventListener("change", function(){
    if(timeInput.value) setTargetHHMM(timeInput.value, false);
  });

  clearTargetBtn.addEventListener("click", function(){ clearTarget(false); });

  /* =========================================================
     PiP (화면 속 화면) — canvas → captureStream → video
     ========================================================= */
  var canvas = $("pipCanvas");
  var video  = $("pipVideo");
  var pipBtn = $("pipBtn"), pipBtnText = $("pipBtnText"), pipNote = $("pipNote");
  var pipCtx = canvas.getContext("2d", { alpha: false });
  var lastDrawMs = 0;
  var stream = null;
  var pipWanted = false;
  var MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
  var SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  var pipColors = null;

  function readColors(){
    var cs = getComputedStyle(document.body);
    var pick = function(name, fb){ var v = cs.getPropertyValue(name); return (v && v.trim()) || fb; };
    return {
      bg: pick("--bg", "#0b0d10"),
      card: pick("--card", "#14171c"),
      text: pick("--text", "#f3f6f9"),
      muted: pick("--muted", "#8b94a3"),
      dim: pick("--dim", "#5c6573"),
      green: pick("--green", "#34d399"),
      red: pick("--red", "#f87171")
    };
  }
  pipColors = readColors();

  function roundRect(ctx, x, y, w, h, r){
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawPip(ms){
    if(!pipCtx) return;
    if(ms - lastDrawMs < 33) return;   // 최대 30fps
    lastDrawMs = ms;

    var W = 640, H = 360, c = pipColors, ctx = pipCtx;
    var d = new Date(ms);
    var rem = target ? Math.max(0, target.ms - ms) : null;
    var warn = rem !== null && rem <= 10000;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = c.bg;
    ctx.fillRect(0, 0, W, H);

    /* 은은한 상단 광원 */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, warn ? "rgba(248,113,113,.14)" : "rgba(52,211,153,.10)");
    g.addColorStop(.55, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 상단: 이름 / 날짜 */
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    ctx.font = "700 17px " + SANS;
    ctx.fillStyle = c.muted;
    ctx.fillText("실시간 시계", 30, 46);

    ctx.textAlign = "right";
    ctx.font = "600 17px " + SANS;
    ctx.fillStyle = c.dim;
    ctx.fillText((d.getMonth() + 1) + "/" + d.getDate() + " (" + WEEK[d.getDay()] + ")", W - 30, 46);

    /* 메인 시각 HH:MM:SS.cc */
    var hh = pad(d.getHours(), 2), mi = pad(d.getMinutes(), 2), ss = pad(d.getSeconds(), 2);
    var cc = pad(Math.floor(d.getMilliseconds() / 10), 2);
    var main = hh + ":" + mi + ":" + ss;
    var dec = "." + cc;

    ctx.font = "600 104px " + MONO;
    var mainW = ctx.measureText(main).width;
    ctx.font = "600 46px " + MONO;
    var decW = ctx.measureText(dec).width;

    var total = mainW + decW + 4;
    var x0 = (W - total) / 2;
    var baseY = rem !== null ? 196 : 216;

    ctx.textAlign = "left";
    ctx.font = "600 104px " + MONO;
    ctx.fillStyle = warn ? c.red : c.text;
    ctx.fillText(main, x0, baseY);

    ctx.font = "600 46px " + MONO;
    ctx.fillStyle = warn ? c.red : c.green;
    ctx.fillText(dec, x0 + mainW + 4, baseY);

    /* 하단: 목표 카운트다운 */
    if(rem !== null){
      var f = fmtCd(rem);
      var cdText = f.big + f.tenth;
      ctx.textAlign = "left";
      ctx.font = "600 21px " + SANS;
      ctx.fillStyle = c.muted;
      ctx.fillText("목표 " + target.hhmm, 30, 300);

      ctx.textAlign = "right";
      ctx.font = "700 40px " + MONO;
      ctx.fillStyle = warn ? c.red : c.text;
      ctx.fillText(cdText, W - 30, 306);

      /* 진행 바 */
      var elapsed = ms - target.setAt;
      var ratio = Math.max(0, Math.min(1, elapsed / target.span));
      var bx = 30, by = 322, bw = W - 60, bh = 8;
      ctx.fillStyle = warn ? "rgba(248,113,113,.22)" : "rgba(139,148,163,.20)";
      roundRect(ctx, bx, by, bw, bh, 4); ctx.fill();
      if(ratio > 0){
        ctx.fillStyle = warn ? c.red : c.green;
        roundRect(ctx, bx, by, Math.max(bh, bw * ratio), bh, 4); ctx.fill();
      }
    } else {
      /* 목표가 없을 때: 현재 초 진행 바 */
      var ratio2 = (d.getSeconds() + d.getMilliseconds() / 1000) / 60;
      var bx2 = 30, by2 = 316, bw2 = W - 60, bh2 = 6;
      ctx.fillStyle = "rgba(139,148,163,.18)";
      roundRect(ctx, bx2, by2, bw2, bh2, 3); ctx.fill();
      ctx.fillStyle = c.green;
      roundRect(ctx, bx2, by2, Math.max(bh2, bw2 * ratio2), bh2, 3); ctx.fill();
    }

    /* 마지막 10초: 테두리 강조 */
    if(warn){
      ctx.strokeStyle = "rgba(248,113,113,.85)";
      ctx.lineWidth = 6;
      roundRect(ctx, 3, 3, W - 6, H - 6, 14);
      ctx.stroke();
    }
  }

  function ensureStream(){
    if(video.srcObject) return true;
    if(!canvas.captureStream) return false;
    try{
      drawPip(Date.now());
      stream = canvas.captureStream(30);
      if(!stream || !stream.getVideoTracks || !stream.getVideoTracks().length) return false;
      video.srcObject = stream;
      video.muted = true;
      video.setAttribute("playsinline", "");
      return true;
    }catch(e){ return false; }
  }

  function note(msg, kind){
    pipNote.textContent = msg || "";
    pipNote.classList.toggle("ok", kind === "ok");
    pipNote.classList.toggle("warn", kind === "warn");
  }

  function isPipActive(){
    try{
      if(document.pictureInPictureElement === video) return true;
      if(video.webkitPresentationMode === "picture-in-picture") return true;
    }catch(e){}
    return false;
  }

  function updatePipUI(){
    var on = isPipActive();
    pipBtn.classList.toggle("on", on);
    pipBtn.setAttribute("aria-pressed", on ? "true" : "false");
    pipBtnText.textContent = on ? "작은 창 닫기" : "작은 창으로 띄우기 (PiP)";
    if(on){
      note("다른 앱을 켜도 화면 위에 떠 있습니다. 창의 일시정지를 누르면 멈춥니다.", "ok");
      lastDrawMs = 0;
    }
  }

  function pipFail(err){
    var name = (err && err.name) ? err.name : "";
    try{ pipNote.setAttribute("data-err", name + (err && err.message ? ": " + err.message : "")); }catch(e){}
    if(name === "NotAllowedError"){
      note("브라우저가 작은 창을 막았습니다. 버튼을 한 번 더 눌러 주세요. (아이폰은 사파리에서, 저전력 모드를 끄면 잘 열립니다)", "warn");
    } else if(name === "NotSupportedError"){
      note("이 브라우저는 화면 속 화면을 지원하지 않습니다. 아이폰은 iOS 15.4 이상 사파리에서 열어 주세요.", "warn");
    } else {
      note("작은 창을 열지 못했습니다. 사파리 최신 버전에서 다시 시도해 주세요.", "warn");
    }
  }

  /* 영상 메타데이터(640×360)가 준비될 때까지 짧게 기다립니다 */
  function whenMetaReady(cb){
    if(video.readyState >= 1){ cb(); return; }
    var done = false;
    function fire(){
      if(done) return;
      done = true;
      video.removeEventListener("loadedmetadata", fire);
      video.removeEventListener("canplay", fire);
      cb();
    }
    video.addEventListener("loadedmetadata", fire);
    video.addEventListener("canplay", fire);
    setTimeout(fire, 900);
  }

  function launchPip(){
    var supportedWk = false;
    try{
      if(typeof video.webkitSupportsPresentationMode === "function"){
        supportedWk = video.webkitSupportsPresentationMode("picture-in-picture");
      }
    }catch(e){ supportedWk = false; }

    if(supportedWk && typeof video.webkitSetPresentationMode === "function"){
      try{
        video.webkitSetPresentationMode("picture-in-picture");
        setTimeout(function(){
          if(isPipActive()){ updatePipUI(); }
          else { note("작은 창이 열리지 않았습니다. 사파리에서 영상 자동 재생이 허용된 상태인지 확인해 주세요.", "warn"); }
        }, 700);
      }catch(e){ pipFail(e); }
      return;
    }
    if(document.pictureInPictureEnabled && video.requestPictureInPicture){
      try{
        var p = video.requestPictureInPicture();
        if(p && p.then){
          p.then(function(){ updatePipUI(); }).catch(function(e){ pipFail(e); });
        }
      }catch(e){ pipFail(e); }
      return;
    }
    note("이 브라우저는 화면 속 화면을 지원하지 않습니다. 아이폰은 iOS 15.4 이상 사파리에서 열어 주세요.", "warn");
  }

  function enterPip(){
    /* 사용자 제스처 안에서 실행: 스트림 준비 → 재생 → PiP */
    var ok = ensureStream();
    if(!ok){
      note("이 브라우저는 화면 속 화면을 지원하지 않습니다. 아이폰은 iOS 15.4 이상 사파리에서 열어 주세요.", "warn");
      return;
    }
    note("작은 창을 여는 중…");

    try{ video.play(); }catch(e){}

    if(video.readyState >= 1){
      launchPip();
    } else {
      whenMetaReady(launchPip);
    }
    setTimeout(function(){ if(isPipActive()) updatePipUI(); lastDrawMs = 0; }, 400);
  }

  function exitPip(){
    try{
      if(document.pictureInPictureElement === video && document.exitPictureInPicture){
        document.exitPictureInPicture().catch(function(){});
        return;
      }
      if(typeof video.webkitSetPresentationMode === "function" && isPipActive()){
        video.webkitSetPresentationMode("inline");
        return;
      }
      video.pause();
    }catch(e){}
    note("");
  }

  pipBtn.addEventListener("click", function(){
    if(isPipActive()) exitPip();
    else enterPip();
  });

  video.addEventListener("enterpictureinpicture", updatePipUI);
  video.addEventListener("leavepictureinpicture", function(){
    note("");
    try{ video.pause(); }catch(e){}
    updatePipUI();
  });
  try{
    video.addEventListener("webkitpresentationmodechanged", function(){
      if(!isPipActive()) note("");
      updatePipUI();
    });
  }catch(e){}

  /* =========================================================
     렌더 루프 (rAF + 백그라운드용 타이머)
     ========================================================= */
  function frame(){
    var now = Date.now();

    /* 캔버스(PiP 소스)는 항상 갱신 — 백그라운드에서도 시계가 돌도록 */
    drawPip(now);

    if(view === "clock"){
      paintClock(now);
      paintCountdown(now);
    }
    if(st.running){
      paintStop();
    }
  }

  var rafId = 0;
  function rafLoop(){
    frame();
    rafId = requestAnimationFrame(rafLoop);
  }
  function startRaf(){ if(!rafId) rafId = requestAnimationFrame(rafLoop); }
  function stopRaf(){ if(rafId){ cancelAnimationFrame(rafId); rafId = 0; } }

  /* 화면이 꺼지거나 다른 앱으로 가도 PiP가 멈추지 않도록 별도 타이머로 계속 그림 */
  setInterval(frame, 40);

  /* =========================================================
     초시계 (기존 기능 유지)
     ========================================================= */
  var mainEl = $("mainTime"), csEl = $("csTime"), clockEl = $("clock");
  var statusText = $("statusText"), underText = $("underText");
  var rowsEl = $("rows"), emptyEl = $("empty"), lapCountEl = $("lapCount");
  var copyBtn = $("copyBtn");

  var st = {
    running: false,
    acc: 0,
    startPerf: 0,
    startWall: 0,
    laps: []
  };

  function nowPerf(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function elapsed(){
    if(st.running){
      var byPerf = nowPerf() - st.startPerf;
      var byWall = Date.now() - st.startWall;
      return st.acc + Math.max(byPerf, byWall);
    }
    return st.acc;
  }

  function fmt(ms){
    if(!isFinite(ms) || ms < 0) ms = 0;
    var totalCs = Math.floor(ms / 10);
    var cs = totalCs % 100;
    var totalSec = Math.floor(totalCs / 100);
    var s = totalSec % 60;
    var totalMin = Math.floor(totalSec / 60);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    var big;
    if(h > 0){
      big = h + ":" + pad(m, 2) + ":" + pad(s, 2);
    } else {
      big = pad(m, 2) + ":" + pad(s, 2);
    }
    return { big: big, cs: "." + pad(cs, 2), short: big + "." + pad(cs, 2) };
  }

  var lastBig = "", lastCs = "";
  function paintStop(){
    var t = fmt(elapsed());
    if(t.big !== lastBig){ mainEl.textContent = t.big; lastBig = t.big; }
    if(t.cs !== lastCs){ csEl.textContent = t.cs; lastCs = t.cs; }
  }

  function setState(s){
    document.body.setAttribute("data-state", s);
    if(s === "idle"){
      statusText.textContent = "READY";
      underText.textContent = "시작을 누르면 0.01초 단위로 기록됩니다";
    } else if(s === "running"){
      statusText.textContent = "RUNNING";
      underText.textContent = "랩을 누르면 구간이 따로 기록됩니다";
    } else if(s === "paused"){
      statusText.textContent = "PAUSED";
      underText.textContent = "계속을 누르면 이어서 기록합니다";
    }
  }

  function beginRun(){
    st.startPerf = nowPerf();
    st.startWall = Date.now();
    st.running = true;
    setState("running");
    paintStop();
    requestWakeLock();
  }

  function start(){
    st.acc = 0;
    st.laps = [];
    renderLaps();
    beginRun();
    sfx("start");
  }

  function pause(){
    if(!st.running) return;
    st.acc = elapsed();
    st.running = false;
    paintStop();
    setState("paused");
    sfx("pause");
    releaseWakeLock();
  }

  function resume(){
    if(st.running) return;
    beginRun();
    sfx("start");
  }

  function reset(){
    st.running = false;
    st.acc = 0;
    st.laps = [];
    paintStop();
    setState("idle");
    renderLaps();
    sfx("reset");
    releaseWakeLock();
  }

  function addLap(){
    if(!st.running) return;
    var total = elapsed();
    var prev = st.laps.length ? st.laps[st.laps.length - 1].total : 0;
    var delta = total - prev;
    if(delta < 1) delta = 0;
    st.laps.push({ delta: delta, total: total });
    renderLaps();
    sfx("lap");
  }

  function renderLaps(){
    lapCountEl.textContent = String(st.laps.length);
    copyBtn.disabled = st.laps.length === 0;

    var n = st.laps.length;
    if(n === 0){
      rowsEl.innerHTML = '<div class="empty" id="empty">랩을 누르면 구간 시간이<br>여기에 쌓입니다</div>';
      return;
    }

    var best = -1, worst = -1;
    if(n >= 2){
      var bv = Infinity, wv = -Infinity;
      for(var i = 0; i < n; i++){
        if(st.laps[i].delta < bv){ bv = st.laps[i].delta; best = i; }
        if(st.laps[i].delta > wv){ wv = st.laps[i].delta; worst = i; }
      }
    }

    var html = "";
    for(var j = n - 1; j >= 0; j--){
      var L = st.laps[j];
      var cls = "row";
      if(j === best) cls += " best";
      if(j === worst) cls += " worst";
      html += '<div class="' + cls + '">'
            + '<div class="n">' + pad(j + 1, 2) + '</div>'
            + '<div class="seg">' + fmt(L.delta).short + '</div>'
            + '<div class="tot">' + fmt(L.total).short + '</div>'
            + '</div>';
    }
    rowsEl.innerHTML = html;
  }

  function copyLaps(){
    if(!st.laps.length) return;
    var lines = ["초시계 기록", ""];
    for(var i = 0; i < st.laps.length; i++){
      var L = st.laps[i];
      lines.push(pad(i + 1, 2) + "  구간 " + fmt(L.delta).short + "   누적 " + fmt(L.total).short);
    }
    lines.push("");
    lines.push("총 " + fmt(elapsed()).short);
    var text = lines.join("\n");

    function ok(){
      copyBtn.textContent = "복사됨";
      copyBtn.classList.add("ok");
      sfx("lap");
      setTimeout(function(){ copyBtn.textContent = "기록 복사"; copyBtn.classList.remove("ok"); }, 1500);
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(function(){ fallback(text, ok); });
    } else {
      fallback(text, ok);
    }
  }
  function fallback(text, cb){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var done = document.execCommand("copy");
      document.body.removeChild(ta);
      if(done) cb();
    }catch(e){}
  }

  /* ---------- 화면 꺼짐 방지 ---------- */
  var wakeLock = null;
  function requestWakeLock(){
    try{
      if(navigator.wakeLock && navigator.wakeLock.request){
        navigator.wakeLock.request("screen").then(function(w){
          wakeLock = w;
          w.addEventListener("release", function(){ wakeLock = null; });
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock && wakeLock.release){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }

  /* ---------- 버튼 ---------- */
  $("startBtn").addEventListener("click", start);
  $("pauseBtn").addEventListener("click", pause);
  $("resumeBtn").addEventListener("click", resume);
  $("resetBtn").addEventListener("click", reset);
  $("resetBtn2").addEventListener("click", reset);
  $("lapBtn").addEventListener("click", addLap);
  copyBtn.addEventListener("click", copyLaps);

  /* ---------- 키보드 ---------- */
  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(view !== "stop") return;
    var k = e.key;
    if(k === " " || k === "Spacebar"){
      e.preventDefault();
      if(st.running) pause(); else if(st.acc > 0) resume(); else start();
    } else if(k === "l" || k === "L"){
      e.preventDefault(); addLap();
    } else if(k === "r" || k === "R"){
      e.preventDefault(); reset();
    }
  });

  /* ---------- 백그라운드/화면 복귀 보정 ---------- */
  function sync(){
    if(view === "clock"){ paintClock(Date.now()); paintCountdown(Date.now()); }
    if(st.running) paintStop();
    lastDrawMs = 0;
    startRaf();
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      sync();
      if(view === "clock" || st.running) requestWakeLock();
    } else {
      if(!st.running) releaseWakeLock();
      /* 백그라운드에서도 타이머(frame)는 계속 돌아 PiP가 멈추지 않습니다 */
    }
  });
  window.addEventListener("pageshow", sync);
  window.addEventListener("focus", sync);
  window.addEventListener("orientationchange", function(){ setTimeout(sync, 120); });

  /* ---------- 초기화 ---------- */
  setState("idle");
  /* 앱을 새로 열면 항상 실시간 시계(티켓팅 모드)로 시작합니다 */
  setView("clock");

  /* 다음 정각 라벨 + 입력 기본값 */
  function refreshNextHour(){
    var d = new Date(Date.now() + 3600000);
    d.setMinutes(0, 0, 0);
    nextHourLabel.textContent = pad(d.getHours(), 2) + ":00";
    if(!timeInput.value) timeInput.value = pad(d.getHours(), 2) + ":00";
  }
  refreshNextHour();

  /* 저장된 목표 복원 (지난 목표는 버림) */
  (function restoreTarget(){
    var raw = store.get("target", "");
    if(!raw) return;
    try{
      var o = JSON.parse(raw);
      if(o && isFinite(o.ms) && o.ms > Date.now() - 60000){
        setTargetMs(o.ms, o.hhmm || "", true);
        markChips(null);
        var chips = chipsEl.querySelectorAll(".chip");
        for(var i = 0; i < chips.length; i++){
          var on = chips[i].getAttribute("data-preset") === o.hhmm;
          chips[i].classList.toggle("on", on);
          chips[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
      } else {
        store.del("target");
      }
    }catch(e){}
  })();

  paintClock(Date.now());
  paintCountdown(Date.now(), true);
  paintStop();
  renderLaps();
  /* PiP 스트림을 미리 만들어 둡니다 — 첫 탭에서 바로 작은 창이 열리도록 */
  ensureStream();
  startRaf();

  /* 매 분 '다음 정각' 라벨 갱신 */
  setInterval(refreshNextHour, 20000);

  /* 외부에서 확인·제어할 수 있는 최소 API */
  window.TicketClock = {
    setTargetMs: function(ms, hhmm){ setTargetMs(ms, hhmm || "", true); },
    clearTarget: function(){ clearTarget(true); },
    getState: function(){
      return {
        view: view,
        targetMs: target ? target.ms : null,
        targetHHMM: target ? target.hhmm : null,
        remaining: target ? Math.max(0, target.ms - Date.now()) : null,
        pipActive: isPipActive(),
        hasStream: !!(video.srcObject && video.srcObject.getVideoTracks && video.srcObject.getVideoTracks().length)
      };
    }
  };
})();
</script>
</body>
</html>
